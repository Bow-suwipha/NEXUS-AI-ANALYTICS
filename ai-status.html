<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="tailwind-config.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-surface text-on-surface font-sans antialiased">
    <div id="navbar-placeholder"></div>
    <main class="w-full pt-16 bg-background min-h-screen">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col gap-space-lg w-full">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div class="flex flex-col gap-1">
                    <h1 class="text-2xl text-on-surface font-bold tracking-tight">AI Status (สถานะระบบ Multi-Agent)</h1>
                    <p class="text-sm text-on-surface-variant">ตรวจสอบการทำงานเบื้องหลังและการใช้ทรัพยากรของ AI</p>
                </div>
                <div
                    class="flex items-center gap-2 bg-surface-container-low px-4 py-2 rounded-xl border border-outline-variant">
                    <span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></span>
                    <span class="text-sm font-semibold text-on-surface">System: Online</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-space-lg">
                <!-- Terminal Log (Spans 2 cols) -->
                <div
                    class="lg:col-span-2 bg-[#1E1E1E] rounded-2xl shadow-sm flex flex-col overflow-hidden border border-outline-variant/30 h-[500px]">
                    <div class="bg-[#2D2D2D] px-4 py-2 flex items-center justify-between border-b border-[#404040]">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[16px] text-gray-400">terminal</span>
                            <span class="text-xs font-semibold text-gray-300 tracking-wider">AGENT EXECUTION LOG</span>
                        </div>
                        <div class="flex gap-1.5">
                            <div class="w-3 h-3 rounded-full bg-error"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-emerald-500"></div>
                        </div>
                    </div>
                    <div class="flex-1 p-4 overflow-y-auto font-mono text-sm flex flex-col gap-2">
                        <!-- Logs will be streamed here via WebSocket -->
                    </div>
                </div>

                <!-- Metrics Column -->
                <div class="flex flex-col gap-space-lg">
                    <!-- Donut Chart -->
                    <div
                        class="bg-surface rounded-2xl border border-outline-variant shadow-sm p-space-md flex flex-col gap-4">
                        <h2 class="text-base font-semibold text-on-surface">อัตราความสำเร็จ (Success Rate)</h2>
                        <div class="relative w-40 h-40 mx-auto flex items-center justify-center">
                            <!-- Pure CSS Donut -->
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                <path class="text-surface-container" stroke-width="3" stroke="currentColor" fill="none"
                                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path id="status-success-svg" class="text-primary transition-all duration-1000"
                                    stroke-dasharray="0, 100" stroke-width="3" stroke-linecap="round"
                                    stroke="currentColor" fill="none"
                                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <div class="absolute flex flex-col items-center">
                                <span id="status-success-text"
                                    class="text-2xl font-bold text-on-surface font-mono">...</span>
                                <span class="text-[10px] text-on-surface-variant">API Requests</span>
                            </div>
                        </div>
                        <div class="flex justify-center gap-4 mt-2">
                            <div class="flex items-center gap-1.5">
                                <div class="w-3 h-3 rounded-full bg-primary"></div><span
                                    class="text-xs text-on-surface-variant">สำเร็จ</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <div class="w-3 h-3 rounded-full bg-surface-container"></div><span
                                    class="text-xs text-on-surface-variant">ล้มเหลว</span>
                            </div>
                        </div>
                    </div>

                    <!-- API Quota -->
                    <div
                        class="bg-surface rounded-2xl border border-outline-variant shadow-sm p-space-md flex flex-col gap-3">
                        <div class="flex items-center justify-between">
                            <h2 class="text-base font-semibold text-on-surface">Groq API Usage</h2>
                            <span class="material-symbols-outlined text-[18px] text-primary">memory</span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between text-sm">
                                <span class="text-on-surface-variant">Tokens Used</span>
                                <span id="status-tokens-text" class="font-bold font-mono text-on-surface">... <span
                                        class="text-on-surface-variant font-normal text-xs">/ 2M</span></span>
                            </div>
                            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden mt-1">
                                <div id="status-tokens-bar"
                                    class="h-full bg-primary rounded-full transition-all duration-1000"
                                    style="width: 0%;"></div>
                            </div>
                        </div>
                        <div
                            class="bg-surface-container-low p-2 rounded-lg border border-outline-variant mt-2 text-xs text-on-surface flex justify-between">
                            <span>Current Model:</span>
                            <span class="font-semibold text-primary">llama3-70b-8192</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="components.js?v=6"></script>
        <script>
            (async () => {
                // Load Status Data
                try {
                    const res = await fetch('api/system_status.php');
                    if (res.ok) {
                        const data = await res.json();

                        const successText = document.getElementById('status-success-text');
                        const successSvg = document.getElementById('status-success-svg');
                        if (successText && successSvg) {
                            successText.innerText = `${data.success_rate}%`;
                            successSvg.setAttribute('stroke-dasharray', `${data.success_rate}, 100`);
                        }

                        const tokensText = document.getElementById('status-tokens-text');
                        const tokensBar = document.getElementById('status-tokens-bar');
                        if (tokensText && tokensBar) {
                            const usedStr = (data.tokens_used / 1000000).toFixed(1) + 'M';
                            const limitStr = (data.tokens_limit / 1000000).toFixed(0) + 'M';
                            tokensText.innerHTML = `${usedStr} <span class="text-on-surface-variant font-normal text-xs">/ ${limitStr}</span>`;

                            const pct = Math.min((data.tokens_used / data.tokens_limit) * 100, 100);
                            tokensBar.style.width = `${pct}%`;
                        }
                    }
                } catch (err) {
                    console.error("Failed to load system status", err);
                }

                const terminalLog = document.querySelector('.overflow-y-auto.font-mono');
                if (terminalLog) terminalLog.innerHTML = '';

                // Simulated Agent Logs
                const agentLogs = [
                    "<span class='text-blue-400'>[System]</span> Initializing Multi-Agent Framework (AutoGen)...",
                    "<span class='text-blue-400'>[System]</span> Establishing connection to Data Sources...",
                    "<span class='text-emerald-500'>[Success] Database 'sales_data' connected.</span>",
                    "<span class='text-purple-400'>[DataAnalystAgent]</span> Fetching latest sales records...",
                    "<span class='text-purple-400'>[DataAnalystAgent]</span> Analyzing rows for trends and anomalies...",
                    "<span class='text-yellow-500'>[Warning] Anomaly detected: Unexpected drop in Branch B revenue.</span>",
                    "<span class='text-orange-400'>[ReportingAgent]</span> Receiving parsed data from DataAnalystAgent...",
                    "<span class='text-orange-400'>[ReportingAgent]</span> Generating executive summary using llama3-70b-8192...",
                    "<span class='text-blue-400'>[System]</span> API Request Sent (Tokens: 1,402)...",
                    "<span class='text-emerald-500'>[Success] Response Received (Tokens: 489).</span>",
                    "<span class='text-orange-400'>[ReportingAgent]</span> Formatting outputs and caching to local storage...",
                    "<span class='text-emerald-500 font-bold'>[System] Task completed successfully. All agents standing by.</span>"
                ];

                let logIndex = 0;
                
                if (terminalLog) {
                    terminalLog.innerHTML += "<div class='text-emerald-500'>[Server] Connected. Waiting for AI Execution...</div>";
                    
                    const logInterval = setInterval(() => {
                        if (logIndex < agentLogs.length) {
                            const newLog = document.createElement('div');
                            newLog.className = 'text-gray-300 mt-1.5';
                            newLog.innerHTML = agentLogs[logIndex];
                            terminalLog.appendChild(newLog);
                            terminalLog.scrollTop = terminalLog.scrollHeight;
                            logIndex++;
                        } else {
                            clearInterval(logInterval);
                        }
                    }, 1200);
                }
            })();
        </script>
    </main>
    <div id="footer-placeholder"></div>
</body>

</html>
